<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Judo Bilan">
<meta name="theme-color" content="#002654">
<title>Judo Bilan</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#002654; --navy-l:#e8edf5;
  --red:#CE1126; --red-l:#fdf0f1; --red-b:#f5b0b8;
  --green:#1a6b3a; --green-bg:#edf7f2; --green-b:#a8d5bb;
  --amber:#7a4800; --amber-bg:#fdf6e8; --amber-b:#e8c97a;
  --ink:#111; --ink2:#2a2a2a; --muted:#7a7a7a; --line:#dde3ed;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:var(--navy);font-family:'Inter',sans-serif;color:var(--ink);overflow:hidden}

.screen{display:none;flex-direction:column;width:100%;height:100%;overflow:hidden}
.screen.active{display:flex}

/* ══ LISTE ══ */
#screen-list{background:var(–navy)}
.list-top{flex-shrink:0;padding:52px 20px 16px}
.list-logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.flag{display:flex;height:14px;width:24px;border-radius:2px;overflow:hidden}
.flag span{flex:1;display:block}
.fb{background:var(–navy)}.fw{background:white}.fr{background:var(–red)}
.brand{font-family:‘Syne’,sans-serif;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:#7a95bb}
.list-title{font-family:‘Syne’,sans-serif;font-size:28px;font-weight:800;color:white;margin-bottom:4px}
.list-sub{font-size:12px;color:#7a95bb}

.btn-new{flex-shrink:0;width:100%;background:var(–red);border:none;color:white;font-family:‘Syne’,sans-serif;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:18px 20px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn-new:active{opacity:.85}

.list-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 40px}
.empty{text-align:center;padding:60px 20px}
.empty-icon{font-size:48px;margin-bottom:14px}
.empty-title{font-family:‘Syne’,sans-serif;font-size:14px;font-weight:700;color:#4a6a8a;margin-bottom:6px}
.empty-sub{font-size:12px;color:#3a5a7a}

.fcard{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer}
.fcard:active{background:rgba(255,255,255,.16)}
.fcard-left{flex:1;min-width:0}
.fcard-name{font-family:‘Syne’,sans-serif;font-size:15px;font-weight:800;color:white;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.fcard-meta{font-size:12px;color:#7a95bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fcard-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.rdot{width:10px;height:10px;border-radius:50%}
.dot-or{background:#ffd700}.dot-ar{background:#d8d8d8}.dot-br{background:#d4a574}
.dot-5{background:var(–green)}.dot-7{background:#999}.dot-el{background:var(–red)}
.fcard-del{background:transparent;border:none;color:rgba(255,255,255,.3);font-size:24px;line-height:1;cursor:pointer;padding:0 4px}
.fcard-arrow{color:#4a6a8a;font-size:20px}

/* ══ ÉDITEUR ══ */
#screen-edit{background:#edf0f5}
.topbar{flex-shrink:0;background:var(–navy);padding:52px 14px 12px;display:flex;align-items:center;gap:8px}
.topbar-back{background:transparent;border:none;color:white;font-size:28px;line-height:1;cursor:pointer;padding:0 4px;flex-shrink:0}
.topbar-title{font-family:‘Syne’,sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:white;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-pdf{flex-shrink:0;background:var(–red);border:none;color:white;font-family:‘Syne’,sans-serif;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:9px 14px;border-radius:4px;cursor:pointer}
.topbar-pdf:active{opacity:.85}
.edit-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* Header fiche */
.hd{background:var(–navy)}
.hd-stripe{display:flex;height:4px}
.hd-stripe .sb{flex:1;background:var(–navy)}.hd-stripe .sw{flex:1;background:white}.hd-stripe .sr{flex:1;background:var(–red)}
.hd-inner{padding:16px 18px 14px}
.hd-eyebrow{font-family:‘Syne’,sans-serif;font-size:8px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:#7a95bb;margin-bottom:6px}
.hd-name{font-family:‘Syne’,sans-serif;font-size:26px;font-weight:800;background:transparent;border:none;color:white;text-transform:uppercase;width:100%;outline:none;line-height:1.1}
.hd-name::placeholder{color:#3a5a7a}
.hd-row2{display:flex;justify-content:space-between;align-items:flex-end;margin-top:12px;gap:12px}
.hd-fields{display:flex;flex-direction:column;gap:7px;flex:1}
.hd-field-row{display:flex;align-items:center;gap:8px}
.hd-field-row span{font-size:13px}
.hdinput{background:transparent;border:none;border-bottom:1px solid #1a3a5e;color:#c0d0e0;font-family:‘Inter’,sans-serif;font-size:12px;padding:3px 2px;flex:1;outline:none}
.hdinput::placeholder{color:#3a5a7a}
.hd-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0}
.rpill{font-family:‘Syne’,sans-serif;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:3px}
.res-or{background:#ffd700;color:#3a2a00}.res-ar{background:#d8d8d8;color:#222}.res-br{background:#d4a574;color:#2a1000}
.res-5{background:var(–green-bg);color:var(–green);border:1px solid var(–green-b)}
.res-7{background:#f0f0f0;color:#666}
.res-el{background:var(–red-l);color:var(–red);border:1px solid var(–red-b)}
.rpill select{appearance:none;background:transparent;border:none;font-family:‘Syne’,sans-serif;font-size:9px;font-weight:800;cursor:pointer;color:inherit;text-transform:uppercase;outline:none}
.hd-comp{text-align:right}
.hd-comp input{background:transparent;border:none;border-bottom:1px solid #1a3a5e;color:#7a95bb;font-family:‘Inter’,sans-serif;font-size:11px;text-align:right;display:block;margin-bottom:4px;outline:none}
.hd-comp input::placeholder{color:#3a5a7a}

.fiche-body{padding:14px 14px 60px;background:white}
.sec-label{font-family:‘Syne’,sans-serif;font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(–navy);padding:12px 0 7px;border-bottom:2px solid var(–navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-label span{flex:1}
.sec-add{font-family:‘Inter’,sans-serif;font-size:11px;font-weight:600;background:transparent;border:1px solid var(–line);color:var(–muted);padding:5px 14px;cursor:pointer;border-radius:3px}

/* ══ COMBAT CARD ══ */
.cc{margin-bottom:14px;border-radius:8px;overflow:hidden;box-shadow:0 2px 10px rgba(0,38,84,.08);border:1.5px solid var(–line)}
.cc.cv{border-left:4px solid var(–green)}.cc.cd{border-left:4px solid var(–red)}.cc.cn{border-left:4px solid var(–line)}

.cc-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(–line);background:white}
.cc-num{width:28px;height:28px;border-radius:50%;background:var(–navy);color:white;display:flex;align-items:center;justify-content:center;font-family:‘Syne’,sans-serif;font-size:12px;font-weight:800;flex-shrink:0}
.cc-badge{font-family:‘Syne’,sans-serif;font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:20px;flex-shrink:0;display:flex;align-items:center}
.ccb-v{background:var(–green-bg);color:var(–green);border:1px solid var(–green-b)}
.ccb-d{background:var(–red-l);color:var(–red);border:1px solid var(–red-b)}
.ccb-n{background:#f0f0f0;color:#888}
.cc-badge select{appearance:none;background:transparent;border:none;font-family:‘Syne’,sans-serif;font-size:9px;font-weight:800;cursor:pointer;color:inherit;text-transform:uppercase;outline:none}
.cc-adv{background:transparent;border:none;border-bottom:1px solid var(–line);font-family:‘Inter’,sans-serif;font-size:13px;font-weight:500;color:var(–ink2);flex:1;padding:2px 3px;outline:none;min-width:0}
.cc-adv::placeholder{color:#ccc}
.cc-del{background:transparent;border:none;color:#ccc;cursor:pointer;font-size:22px;padding:0 3px;flex-shrink:0;line-height:1}

.cc-profile{padding:10px 12px;background:var(–navy-l);border-bottom:1px solid var(–line)}
.cc-profile-title{font-family:‘Syne’,sans-serif;font-size:7px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(–navy);margin-bottom:8px;padding-bottom:4px;border-bottom:1.5px solid var(–navy)}
.profile-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #c8d4e4}
.profile-key{font-size:8px;color:var(–navy);width:60px;flex-shrink:0;font-weight:800;text-transform:uppercase;letter-spacing:1px;background:rgba(0,38,84,.08);padding:2px 5px;border-radius:2px;text-align:center}
.profile-chips{display:flex;gap:4px;flex-wrap:wrap}
.pchip{font-family:‘Inter’,sans-serif;font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px;cursor:pointer;border:1px solid #b0c0d8;background:white;color:#4a6a8a;user-select:none;-webkit-user-select:none}
.pchip.active{background:var(–navy);color:white;border-color:var(–navy)}
.profile-obs{width:100%;background:transparent;border:none;border-bottom:1px solid #b0c0d8;font-family:‘Inter’,sans-serif;font-size:11px;color:var(–ink2);margin-top:8px;padding:3px 2px;outline:none}
.profile-obs::placeholder{color:#aab8cc;font-style:italic}

.cc-scores{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(–line);background:#fafafa}
.cc-score-col{padding:8px 12px}
.cc-score-col:first-child{border-right:1px solid var(–line)}
.score-title{font-family:‘Syne’,sans-serif;font-size:7px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;padding-bottom:3px;border-bottom:1.5px solid currentColor}
.sct-m{color:var(–green)}.sct-c{color:var(–red)}
.score-row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:5px}
.score-lbl{font-size:11px;color:var(–muted);flex:1}
.counter{display:flex;align-items:center;gap:4px}
.cnt-btn{width:26px;height:26px;border:1px solid var(–line);background:white;font-size:16px;cursor:pointer;border-radius:4px;color:var(–muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.cnt-btn:active{background:var(–navy);color:white;border-color:var(–navy)}
.cnt-val{font-family:‘Syne’,sans-serif;font-size:16px;font-weight:800;min-width:22px;text-align:center;line-height:1}
.cv-g{color:var(–green)}.cv-r{color:var(–red)}.cv-a{color:var(–amber)}.cv-b{color:var(–navy)}

.cc-obs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(–line)}
.cc-obs-col{padding:12px 12px}
.cc-obs-col:first-child{border-right:1px solid var(–line)}
.obs-title{font-family:‘Syne’,sans-serif;font-size:8px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:9px;padding-bottom:5px;border-bottom:1.5px solid currentColor}
.obs-pos{color:var(–green)}.obs-neg{color:var(–red)}
.mini-list{display:flex;flex-direction:column;margin-bottom:6px}
.mini-item{display:flex;align-items:flex-start;gap:7px;margin-bottom:5px}
.mini-dot{width:6px;height:6px;border-radius:50%;margin-top:7px;flex-shrink:0}
.mini-text{flex:1;font-size:13px;color:var(–ink2);line-height:1.5;min-height:22px;padding:2px 0;cursor:text}
.mini-text.ph{color:#bbb;font-style:italic}
.mini-input{flex:1;background:#fffbe6;border:none;border-bottom:1.5px solid;font-family:‘Inter’,sans-serif;font-size:13px;color:var(–ink2);padding:3px 5px;outline:none}
.mini-add{font-size:12px;background:transparent;border:none;cursor:pointer;font-family:‘Inter’,sans-serif;opacity:.5;padding:3px 0;display:flex;align-items:center;gap:3px}

.cc-work{display:grid;grid-template-columns:1fr 1fr 1fr;background:#f4f6fb}
.cc-work-col{padding:10px 10px}
.cc-work-col:not(:last-child){border-right:1px solid var(–line)}
.work-title{font-family:‘Syne’,sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(–line);display:flex;align-items:center;gap:5px;color:var(–ink2)}
.wdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.wd-t{background:var(–red)}.wd-a{background:var(–navy)}.wd-m{background:#5a1a8a}
.work-list{display:flex;flex-direction:column;margin-bottom:6px}
.work-item{display:flex;align-items:flex-start;gap:5px;margin-bottom:5px}
.work-n{font-size:10px;font-weight:700;color:var(–muted);min-width:14px;margin-top:3px;flex-shrink:0}
.work-text{flex:1;font-size:12px;color:var(–ink2);line-height:1.5;min-height:20px;cursor:text}
.work-text.ph{color:#bbb;font-style:italic}
.work-input{flex:1;background:#fffbe6;border:none;border-bottom:1.5px solid var(–line);font-family:‘Inter’,sans-serif;font-size:12px;color:var(–ink2);padding:3px 5px;outline:none}
.work-add{font-size:12px;background:transparent;border:none;cursor:pointer;color:var(–muted);opacity:.4;padding:2px 0}

.priority-block{border:2px solid var(–navy);border-radius:8px;overflow:hidden;margin-bottom:14px}
.prio-header{background:var(–navy);padding:10px 16px}
.prio-title{font-family:‘Syne’,sans-serif;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:white}
.prio-accent{height:3px;background:var(–red)}
.prio-body{padding:12px 16px;display:flex;flex-direction:column;gap:7px}
.prio-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:4px;border-left:4px solid;background:#f8f9fc}
.prio-1{border-color:var(–red)}.prio-2{border-color:var(–amber)}.prio-3{border-color:var(–navy)}
.prio-num{font-family:‘Syne’,sans-serif;font-size:18px;font-weight:800;min-width:20px;text-align:center;line-height:1;flex-shrink:0}
.pn-1{color:var(–red)}.pn-2{color:var(–amber)}.pn-3{color:var(–navy)}
.prio-input{background:transparent;border:none;font-family:‘Inter’,sans-serif;font-size:13px;font-weight:500;color:var(–ink2);width:100%;outline:none}
.prio-input::placeholder{color:#bbb;font-style:italic}
.prio-del{background:transparent;border:none;color:#ccc;cursor:pointer;font-size:18px;padding:0;flex-shrink:0;line-height:1}
.prio-add{font-family:‘Inter’,sans-serif;font-size:12px;font-weight:600;background:transparent;border:1px dashed var(–line);color:var(–muted);padding:9px;cursor:pointer;border-radius:4px;text-align:center;width:calc(100% - 32px);margin:0 16px 14px;display:block}

.coach-row{background:var(–amber-bg);border:1.5px solid var(–amber-b);border-radius:6px;padding:11px 14px;display:flex;gap:12px;align-items:flex-start}
.coach-label{font-family:‘Syne’,sans-serif;font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(–amber);white-space:nowrap;margin-top:2px;min-width:50px;line-height:1.6}
.coach-input{flex:1;background:transparent;border:none;font-family:‘Inter’,sans-serif;font-size:13px;line-height:1.6;color:var(–ink2);resize:none;width:100%;outline:none;min-height:44px}
.coach-input::placeholder{color:#c8b880;font-style:italic}

/* ══ MODAL ══ */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal-overlay.on{display:flex}
.modal{background:white;border-radius:12px;padding:28px 22px;max-width:320px;width:100%;text-align:center}
.modal-title{font-family:‘Syne’,sans-serif;font-size:17px;font-weight:800;color:var(–navy);margin-bottom:10px}
.modal-txt{font-size:13px;color:var(–muted);margin-bottom:24px;line-height:1.5}
.modal-btns{display:flex;gap:12px}
.modal-btn{flex:1;padding:13px;border-radius:6px;border:none;font-family:‘Syne’,sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.modal-cancel{background:#f0f0f0;color:var(–muted)}
.modal-confirm{background:var(–red);color:white}

/* ══ APERÇU ══ */
#screen-preview{background:#3a3a3a}
.preview-bar{flex-shrink:0;background:#222;padding:52px 16px 12px;display:flex;align-items:center;gap:10px}
.preview-back{background:transparent;border:none;color:white;font-size:28px;line-height:1;cursor:pointer;padding:0 4px;flex-shrink:0}
.preview-bar-title{font-family:‘Syne’,sans-serif;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:white;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview-hint{flex-shrink:0;background:var(–red);border-radius:6px;padding:7px 12px;text-align:center}
.preview-hint div{font-size:10px;color:white;font-weight:600;white-space:nowrap}
.preview-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px}
.preview-paper{background:white;max-width:700px;margin:0 auto;box-shadow:0 6px 30px rgba(0,0,0,.5)}

/* ══ PRINT ══ */
@media print {
@page{size:A4 portrait;margin:8mm}
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
body{overflow:visible!important;height:auto!important;background:white!important}
#screen-list,#screen-edit{display:none!important}
#screen-preview{display:block!important;height:auto!important;overflow:visible!important;background:white!important}
.preview-bar{display:none!important}
.preview-scroll{overflow:visible!important;padding:0!important}
.preview-paper{box-shadow:none!important;max-width:100%!important}
}
</style>

</head>
<body>

<!-- LISTE -->

<div id="screen-list" class="screen active">
  <div class="list-top">
    <div class="list-logo">
      <div class="flag"><span class="fb"></span><span class="fw"></span><span class="fr"></span></div>
      <span class="brand">France Judo</span>
    </div>
    <div class="list-title">Fiches Bilan</div>
    <div class="list-sub">Compétition · Analyse individuelle</div>
  </div>
  <button class="btn-new" onclick="newFiche()">
    <span style="font-size:22px;font-weight:300">＋</span> Nouvelle fiche
  </button>
  <div class="list-scroll">
    <div class="empty" id="empty">
      <div class="empty-icon">🥋</div>
      <div class="empty-title">Aucune fiche</div>
      <div class="empty-sub">Appuie sur "Nouvelle fiche" pour commencer</div>
    </div>
    <div id="list-items"></div>
  </div>
</div>

<!-- ÉDITEUR -->

<div id="screen-edit" class="screen">
  <div class="topbar">
    <button class="topbar-back" onclick="goBack()">‹</button>
    <div class="topbar-title" id="topbar-title">Nouvelle fiche</div>
    <button class="topbar-pdf" onclick="showPreview()">🖨 Aperçu PDF</button>
  </div>
  <div class="edit-scroll"><div id="fiche-content"></div></div>
</div>

<!-- APERÇU PDF -->

<div id="screen-preview" class="screen">
  <div class="preview-bar">
    <button class="preview-back" onclick="closePreview()">‹</button>
    <div class="preview-bar-title" id="preview-bar-title">Aperçu</div>
    <div class="preview-hint">
      <div>📤 Partager</div>
      <div>→ Imprimer → PDF</div>
    </div>
  </div>
  <div class="preview-scroll">
    <div class="preview-paper" id="preview-paper"></div>
  </div>
</div>

<!-- MODAL -->

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-title">Supprimer ?</div>
    <div class="modal-txt">Cette fiche sera définitivement supprimée.</div>
    <div class="modal-btns">
      <button class="modal-btn modal-cancel" onclick="closeModal()">Annuler</button>
      <button class="modal-btn modal-confirm" id="modal-ok">Supprimer</button>
    </div>
  </div>
</div>

<script>
'use strict';
const SK='judo_v11';
function loadFiches(){try{return JSON.parse(localStorage.getItem(SK))||[];}catch(e){return[];}}
function saveFiches(a){try{localStorage.setItem(SK,JSON.stringify(a));}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let currentId=null,pendingDel=null,combatN=0;

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

/* ── LISTE ── */
const DOTS={or:'dot-or',ar:'dot-ar',br:'dot-br','5':'dot-5','7':'dot-7',el:'dot-el'};
const RMAP={or:'res-or',ar:'res-ar',br:'res-br','5':'res-5','7':'res-7',el:'res-el'};

function renderList(){
  const fiches=loadFiches();
  const el=document.getElementById('list-items');
  document.getElementById('empty').style.display=fiches.length?'none':'block';
  el.innerHTML='';
  [...fiches].reverse().forEach(f=>{
    const card=document.createElement('div');
    card.className='fcard';
    card.innerHTML=`
      <div class="fcard-left">
        <div class="fcard-name">${esc(f.name||'Sans nom')}</div>
        <div class="fcard-meta">${esc([f.comp,f.date].filter(Boolean).join(' · ')||'—')}</div>
      </div>
      <div class="fcard-right">
        <div class="rdot ${DOTS[f.result]||'dot-el'}"></div>
        <button class="fcard-del" onclick="event.stopPropagation();askDel('${f.id}')">×</button>
        <div class="fcard-arrow">›</div>
      </div>`;
    card.addEventListener('click',()=>openFiche(f.id));
    el.appendChild(card);
  });
}

function askDel(id){
  pendingDel=id;
  document.getElementById('modal').classList.add('on');
  document.getElementById('modal-ok').onclick=()=>{
    saveFiches(loadFiches().filter(f=>f.id!==pendingDel));
    closeModal();renderList();
  };
}
function closeModal(){document.getElementById('modal').classList.remove('on');}

/* ── FICHE ── */
function newFiche(){
  const f={id:uid(),name:'',cat:'',club:'',grade:'',comp:'',date:'',result:'el',combats:[],prios:[],coach:''};
  const fiches=loadFiches();fiches.push(f);saveFiches(fiches);openFiche(f.id);
}

function openFiche(id){
  currentId=id;combatN=0;
  const f=loadFiches().find(x=>x.id===id);
  if(!f)return;
  buildUI(f);
  showScreen('screen-edit');
  document.querySelector('.edit-scroll').scrollTop=0;
}

function goBack(){saveCurrent();showScreen('screen-list');renderList();}

const ROPTS=[{v:'or',l:'🥇 Or'},{v:'ar',l:'🥈 Argent'},{v:'br',l:'🥉 Bronze'},{v:'5',l:'5e place'},{v:'7',l:'7e place'},{v:'el',l:'Éliminé(e)'}];

function buildUI(f){
  const opts=ROPTS.map(r=>`<option value="${r.v}"${f.result===r.v?' selected':''}>${r.l}</option>`).join('');
  document.getElementById('fiche-content').innerHTML=`
<div class="hd">
  <div class="hd-stripe"><span class="sb"></span><span class="sw"></span><span class="sr"></span></div>
  <div class="hd-inner">
    <div class="hd-eyebrow">Fiche bilan individuel · Compétition</div>
    <input class="hd-name" id="f-name" placeholder="NOM Prénom" value="${esc(f.name)}"
      oninput="document.getElementById('topbar-title').textContent=this.value||'Nouvelle fiche'">
    <div class="hd-row2">
      <div class="hd-fields">
        <div class="hd-field-row"><span>⚖️</span><input class="hdinput" id="f-cat" placeholder="Catégorie" value="${esc(f.cat)}"></div>
        <div class="hd-field-row"><span>🏢</span><input class="hdinput" id="f-club" placeholder="Club" value="${esc(f.club)}"></div>
        <div class="hd-field-row"><span>🎽</span><input class="hdinput" id="f-grade" placeholder="Grade" value="${esc(f.grade)}"></div>
      </div>
      <div class="hd-right">
        <div class="rpill ${RMAP[f.result]||'res-el'}" id="f-rpill">
          <select id="f-result" onchange="onRC(this.value)">${opts}</select>
        </div>
        <div class="hd-comp">
          <input id="f-comp" placeholder="Compétition" value="${esc(f.comp)}">
          <input id="f-date" placeholder="Date · Lieu" value="${esc(f.date)}">
        </div>
      </div>
    </div>
  </div>
</div>
<div class="fiche-body">
  <div class="sec-label"><span>Combats</span><button class="sec-add" onclick="addCombat()">+ Combat</button></div>
  <div id="combats"></div>
  <div class="sec-label" style="margin-top:10px"><span>Priorités de travail</span></div>
  <div class="priority-block">
    <div class="prio-header"><div class="prio-title">⚡ Plan d'action prioritaire</div></div>
    <div class="prio-accent"></div>
    <div class="prio-body" id="prios"></div>
    <button class="prio-add" onclick="addPrio()">+ Ajouter une priorité</button>
  </div>
  <div class="coach-row">
    <div class="coach-label">Note<br>Coach</div>
    <textarea class="coach-input" id="f-coach" rows="3" placeholder="Contexte, ressenti, points à discuter…">${esc(f.coach)}</textarea>

  </div>
</div>`;
  document.getElementById('topbar-title').textContent=f.name||'Nouvelle fiche';
  (f.combats||[]).forEach(c=>addCombat(c));
  (f.prios||[]).forEach(p=>addPrio(p));
}

function onRC(v){document.getElementById(‘f-rpill’).className=’rpill ’+(RMAP[v]||‘res-el’);}

/* ── SAVE ── */
function saveCurrent(){
if(!currentId)return;
const fiches=loadFiches();
const idx=fiches.findIndex(x=>x.id===currentId);
if(idx===-1)return;
const gv=id=>{const e=document.getElementById(id);return e?e.value.trim():’’;}
const combats=[];
document.querySelectorAll(’#combats .cc’).forEach(card=>{
const cid=card.id;
const sel=card.querySelector(‘select’);
const chips=[];
card.querySelectorAll(’.pchip.active’).forEach(c=>chips.push(c.textContent));
const gs=k=>parseInt(document.getElementById(k+’*’+cid)?.textContent||0);
const rL=lid=>{const a=[];document.querySelectorAll(’#’+lid+’ .mini-item’).forEach(item=>{const sp=item.querySelector(’.mini-text:not(.ph)’);const inp=item.querySelector(’.mini-input’);const v=inp?inp.value.trim():(sp?sp.textContent.trim():’’);if(v)a.push(v);});return a;};
const rW=lid=>{const a=[];document.querySelectorAll(’#’+lid+’ .work-item’).forEach(item=>{const sp=item.querySelector(’.work-text:not(.ph)’);const inp=item.querySelector(’.work-input’);const v=inp?inp.value.trim():(sp?sp.textContent.trim():’’);if(v)a.push(v);});return a;};
combats.push({result:sel?sel.value:’’,adv:gv(’adv*’+cid),styleobs:gv(‘obs_’+cid),chips,im:gs(‘im’),wm:gs(‘wm’),ym:gs(‘ym’),pm:gs(‘pm’),ic:gs(‘ic’),wc:gs(‘wc’),yc:gs(‘yc’),sc:gs(‘sc’),pos:rL(‘pos_’+cid),neg:rL(‘neg_’+cid),wt:rW(‘wt_’+cid),wta:rW(‘wta_’+cid),wmc:rW(‘wmc_’+cid)});
});
const prios=[];
document.querySelectorAll(’#prios .prio-input’).forEach(i=>{if(i.value.trim())prios.push(i.value.trim());});
fiches[idx]={…fiches[idx],name:gv(‘f-name’),cat:gv(‘f-cat’),club:gv(‘f-club’),grade:gv(‘f-grade’),comp:gv(‘f-comp’),date:gv(‘f-date’),result:gv(‘f-result’)||‘el’,coach:gv(‘f-coach’),combats,prios};
saveFiches(fiches);
}

/* ── COMBAT ── */
function addCombat(data){
combatN++;
const n=combatN,cid=‘cc’+n;
const rv=data?(data.result||’’):’’;
const cc=rv===‘V’?‘cc cv’:rv===‘D’?‘cc cd’:‘cc cn’;
const bc=rv===‘V’?‘cc-badge ccb-v’:rv===‘D’?‘cc-badge ccb-d’:‘cc-badge ccb-n’;
const mkC=(list,grp)=>list.map(c=>{const a=data&&data.chips&&data.chips.includes(c)?’ active’:’’;return`<span class="pchip${a}" onclick="toggleChip(this,'${grp}')">${c}</span>`;}).join(’’);
const card=document.createElement(‘div’);
card.className=cc;card.id=cid;
card.innerHTML=`

<div class="cc-head">
  <div class="cc-num">${n}</div>
  <div class="${bc}" id="ccb_${cid}">
    <select onchange="paintCC(this,'${cid}')">
      <option value=""${!rv?' selected':''}>—</option>
      <option value="V"${rv==='V'?' selected':''}>Victoire</option>
      <option value="D"${rv==='D'?' selected':''}>Défaite</option>
    </select>
  </div>
  <input class="cc-adv" id="adv_${cid}" placeholder="NOM Adversaire · Pays / Club" value="${esc(data&&data.adv||'')}">
  <button class="cc-del" onclick="document.getElementById('${cid}').remove()">×</button>
</div>
<div class="cc-profile">
  <div class="cc-profile-title">Profil adversaire</div>
  <div class="profile-row"><span class="profile-key">Latéralité</span><div class="profile-chips">${mkC(['Droitier','Gaucher'],'lat_'+cid)}</div></div>
  <div class="profile-row"><span class="profile-key">Garde</span><div class="profile-chips">${mkC(['Basse','Haute','Triceps','Croisée'],'garde_'+cid)}</div></div>
  <div class="profile-row"><span class="profile-key">Profil</span><div class="profile-chips">${mkC(['Offensif','Tactique'],'profil_'+cid)}</div></div>
  <input class="profile-obs" id="obs_${cid}" placeholder="Technique principale, particularité…" value="${esc(data&&data.styleobs||'')}">
</div>
<div class="cc-scores">
  <div class="cc-score-col">
    <div class="score-title sct-m">✓ Marqués</div>
    ${mkSc('Ippon','im_'+cid,'cv-g',data&&data.im||0)}
    ${mkSc('Waza-ari','wm_'+cid,'cv-g',data&&data.wm||0)}
    ${mkSc('Yuko','ym_'+cid,'cv-b',data&&data.ym||0)}
    ${mkSc('Shido adv.','pm_'+cid,'cv-a',data&&data.pm||0)}
  </div>
  <div class="cc-score-col">
    <div class="score-title sct-c">✕ Concédés</div>
    ${mkSc('Ippon','ic_'+cid,'cv-r',data&&data.ic||0)}
    ${mkSc('Waza-ari','wc_'+cid,'cv-r',data&&data.wc||0)}
    ${mkSc('Yuko','yc_'+cid,'cv-r',data&&data.yc||0)}
    ${mkSc('Shido','sc_'+cid,'cv-a',data&&data.sc||0)}
  </div>
</div>
<div class="cc-obs">
  <div class="cc-obs-col">
    <div class="obs-title obs-pos">✓ Ce qui a bien marché</div>
    <div class="mini-list" id="pos_${cid}"></div>
    <button class="mini-add" style="color:var(--green)" onclick="addMini('pos_${cid}','var(--green)')">＋ Ajouter</button>
  </div>
  <div class="cc-obs-col">
    <div class="obs-title obs-neg">✕ Ce qui a moins bien marché</div>
    <div class="mini-list" id="neg_${cid}"></div>
    <button class="mini-add" style="color:var(--red)" onclick="addMini('neg_${cid}','var(--red)')">＋ Ajouter</button>
  </div>
</div>
<div class="cc-work">
  <div class="cc-work-col"><div class="work-title"><div class="wdot wd-t"></div>Technique</div><div class="work-list" id="wt_${cid}"></div><button class="work-add" onclick="addWork('wt_${cid}')">＋ Ajouter</button></div>
  <div class="cc-work-col"><div class="work-title"><div class="wdot wd-a"></div>Tactique</div><div class="work-list" id="wta_${cid}"></div><button class="work-add" onclick="addWork('wta_${cid}')">＋ Ajouter</button></div>
  <div class="cc-work-col"><div class="work-title"><div class="wdot wd-m"></div>Mental</div><div class="work-list" id="wmc_${cid}"></div><button class="work-add" onclick="addWork('wmc_${cid}')">＋ Ajouter</button></div>
</div>`;
  document.getElementById('combats').appendChild(card);
  if(data){
    (data.pos||[]).forEach(t=>addMini('pos_'+cid,'var(--green)',t));
    (data.neg||[]).forEach(t=>addMini('neg_'+cid,'var(--red)',t));
    (data.wt||[]).forEach(t=>addWork('wt_'+cid,t));
    (data.wta||[]).forEach(t=>addWork('wta_'+cid,t));
    (data.wmc||[]).forEach(t=>addWork('wmc_'+cid,t));
  }
}

function mkSc(lbl,id,cls,val){
return`<div class="score-row"><span class="score-lbl">${lbl}</span><div class="counter"><button class="cnt-btn" onclick="decr('${id}')">−</button><span class="cnt-val ${cls}" id="${id}">${val||0}</span><button class="cnt-btn" onclick="incr('${id}')">+</button></div></div>`;
}
function incr(id){const e=document.getElementById(id);e.textContent=parseInt(e.textContent)+1;}
function decr(id){const e=document.getElementById(id);const v=parseInt(e.textContent);if(v>0)e.textContent=v-1;}
function paintCC(sel,cid){
const b=document.getElementById(‘ccb_’+cid),c=document.getElementById(cid);
if(sel.value===‘V’){b.className=‘cc-badge ccb-v’;c.className=‘cc cv’;}
else if(sel.value===‘D’){b.className=‘cc-badge ccb-d’;c.className=‘cc cd’;}
else{b.className=‘cc-badge ccb-n’;c.className=‘cc cn’;}
}
function toggleChip(el,grp){
if(grp.startsWith(‘lat’))el.closest(’.profile-chips’).querySelectorAll(’.pchip’).forEach(c=>c.classList.remove(‘active’));
el.classList.toggle(‘active’);
}

/* ── Mini obs ── */
function addMini(listId,color,val){
const list=document.getElementById(listId);
const item=document.createElement(‘div’);item.className=‘mini-item’;
const dot=document.createElement(‘div’);dot.className=‘mini-dot’;dot.style.background=color;
item.appendChild(dot);
if(val!==undefined&&val!==’’){
const sp=document.createElement(‘span’);sp.className=‘mini-text’;sp.textContent=val;
sp.onclick=()=>editMini(sp,color);item.appendChild(sp);
} else {
const inp=mkMiniInp(color);item.appendChild(inp);setTimeout(()=>inp.focus(),60);
}
list.appendChild(item);
}
function mkMiniInp(color){
const inp=document.createElement(‘input’);inp.className=‘mini-input’;inp.placeholder=‘Observation…’;inp.style.borderBottomColor=color;
inp.onblur=()=>{
const sp=document.createElement(‘span’);
sp.className=inp.value.trim()?‘mini-text’:‘mini-text ph’;
sp.textContent=inp.value.trim()||‘Appuie pour écrire…’;
sp.onclick=()=>editMini(sp,color);
inp.parentNode.replaceChild(sp,inp);
};
inp.onkeydown=e=>{if(e.key===‘Enter’)inp.blur();};
return inp;
}
function editMini(sp,color){
const inp=mkMiniInp(color);inp.value=sp.classList.contains(‘ph’)?’’:sp.textContent;
sp.parentNode.replaceChild(inp,sp);inp.focus();inp.select();
}

/* ── Work ── */
function addWork(listId,val){
const list=document.getElementById(listId);
const n=list.querySelectorAll(’.work-item’).length+1;
const item=document.createElement(‘div’);item.className=‘work-item’;
const num=document.createElement(‘span’);num.className=‘work-n’;num.textContent=n+’.’;
item.appendChild(num);
if(val!==undefined&&val!==’’){
const sp=document.createElement(‘span’);sp.className=‘work-text’;sp.textContent=val;
sp.onclick=()=>editWork(sp);item.appendChild(sp);
} else {
const inp=mkWorkInp();item.appendChild(inp);setTimeout(()=>inp.focus(),60);
}
list.appendChild(item);
}
function mkWorkInp(){
const inp=document.createElement(‘input’);inp.className=‘work-input’;inp.placeholder=‘À travailler…’;
inp.onblur=()=>{
const sp=document.createElement(‘span’);
sp.className=inp.value.trim()?‘work-text’:‘work-text ph’;
sp.textContent=inp.value.trim()||‘Appuie pour écrire…’;
sp.onclick=()=>editWork(sp);
inp.parentNode.replaceChild(sp,inp);
};
inp.onkeydown=e=>{if(e.key===‘Enter’)inp.blur();};
return inp;
}
function editWork(sp){
const inp=mkWorkInp();inp.value=sp.classList.contains(‘ph’)?’’:sp.textContent;
sp.parentNode.replaceChild(inp,sp);inp.focus();inp.select();
}

/* ── Priorités ── */
function addPrio(val){
const body=document.getElementById(‘prios’);
const n=body.querySelectorAll(’.prio-item’).length+1;
const lv=n<=3?n:((n-1)%3)+1;
const item=document.createElement(‘div’);item.className=‘prio-item prio-’+lv;
item.innerHTML=`<span class="prio-num pn-${lv}">${n}</span><input class="prio-input" placeholder="Priorité de travail…" value="${esc(val||'')}"><button class="prio-del" onclick="this.closest('.prio-item').remove();reNumPrios()">×</button>`;
body.appendChild(item);
if(!val)setTimeout(()=>item.querySelector(‘input’).focus(),60);
}
function reNumPrios(){
document.querySelectorAll(’#prios .prio-item’).forEach((it,i)=>{
const n=i+1,lv=n<=3?n:((n-1)%3)+1;
it.className=‘prio-item prio-’+lv;
it.querySelector(’.prio-num’).className=‘prio-num pn-’+lv;
it.querySelector(’.prio-num’).textContent=n;
});
}

/* ── APERÇU PDF ── */
function showPreview(){
saveCurrent();
const f=loadFiches().find(x=>x.id===currentId);
if(!f)return;
document.getElementById(‘preview-bar-title’).textContent=f.name||‘Aperçu’;
document.getElementById(‘preview-paper’).innerHTML=buildPaper(f);
showScreen(‘screen-preview’);
document.querySelector(’.preview-scroll’).scrollTop=0;
}
function closePreview(){showScreen(‘screen-edit’);}

function buildPaper(f){
const RS={or:{l:‘🥇 Or’,s:‘background:#ffd700;color:#3a2a00’},ar:{l:‘🥈 Argent’,s:‘background:#d8d8d8;color:#222’},br:{l:‘🥉 Bronze’,s:‘background:#d4a574;color:#2a1000’},‘5’:{l:‘5e place’,s:‘background:#edf7f2;color:#1a6b3a;border:1px solid #a8d5bb’},‘7’:{l:‘7e place’,s:‘background:#f0f0f0;color:#666’},el:{l:‘Éliminé(e)’,s:‘background:#fdf0f1;color:#CE1126;border:1px solid #f5b0b8’}};
const res=RS[f.result]||RS.el;
const mR=(items,color)=>{const fl=(items||[]).filter(Boolean);if(!fl.length)return`<span style="font-size:11px;color:#ccc;font-style:italic">—</span>`;return fl.map(t=>`<div style="display:flex;align-items:flex-start;gap:5px;margin-bottom:5px"><div style="width:5px;height:5px;border-radius:50%;background:${color};margin-top:6px;flex-shrink:0"></div><span style="font-size:11px;color:#2a2a2a;line-height:1.5">${esc(t)}</span></div>`).join(’’);};
const wR=(items)=>{const fl=(items||[]).filter(Boolean);if(!fl.length)return`<span style="font-size:11px;color:#ccc;font-style:italic">—</span>`;return fl.map((t,i)=>`<div style="display:flex;gap:5px;margin-bottom:4px"><span style="font-size:10px;font-weight:700;color:#7a7a7a;min-width:14px;flex-shrink:0">${i+1}.</span><span style="font-size:11px;color:#2a2a2a;line-height:1.5">${esc(t)}</span></div>`).join(’’);};
const sR=(lbl,val,col)=>`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span style="font-size:10px;color:#7a7a7a">${lbl}</span><span style="font-family:'Syne',sans-serif;font-size:15px;font-weight:800;color:${col}">${val||0}</span></div>`;
const cbs=(f.combats||[]).map((c,i)=>{
const bc=c.result===‘V’?’#1a6b3a’:c.result===‘D’?’#CE1126’:’#dde3ed’;
const rl=c.result===‘V’?‘VICTOIRE’:c.result===‘D’?‘DÉFAITE’:’—’;
const rc=c.result===‘V’?’#1a6b3a’:c.result===‘D’?’#CE1126’:’#888’;
const rbg=c.result===‘V’?’#edf7f2’:c.result===‘D’?’#fdf0f1’:’#f0f0f0’;
return`<div style="margin-bottom:10px;border:1.5px solid #dde3ed;border-left:4px solid ${bc};border-radius:4px;overflow:hidden">

<div style="display:flex;align-items:center;gap:8px;padding:8px 11px;border-bottom:1px solid #dde3ed;background:white">
  <div style="width:22px;height:22px;border-radius:50%;background:#002654;color:white;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-size:10px;font-weight:800;flex-shrink:0">${i+1}</div>
  <span style="font-family:'Syne',sans-serif;font-size:8px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:10px;background:${rbg};color:${rc};flex-shrink:0">${rl}</span>
  <span style="font-size:11px;font-weight:600;color:#2a2a2a">${esc(c.adv||'—')}</span>
</div>
<div style="background:#e8edf5;padding:6px 11px;border-bottom:1px solid #dde3ed">
  <span style="font-family:'Syne',sans-serif;font-size:7px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#002654">${(c.chips||[]).join('  ·  ')||'—'}</span>
  ${c.styleobs?`<div style="font-size:10px;color:#2a2a2a;margin-top:3px;font-style:italic">${esc(c.styleobs)}</div>`:''}
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid #dde3ed;background:#fafafa">
  <div style="padding:6px 11px;border-right:1px solid #dde3ed">
    <div style="font-family:'Syne',sans-serif;font-size:7px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#1a6b3a;margin-bottom:5px;padding-bottom:3px;border-bottom:1.5px solid #1a6b3a">✓ Marqués</div>
    ${sR('Ippon',c.im,'#1a6b3a')}${sR('Waza-ari',c.wm,'#1a6b3a')}${sR('Yuko',c.ym,'#002654')}${sR('Shido adv.',c.pm,'#7a4800')}
  </div>
  <div style="padding:6px 11px">

</div>
</div>`;
  }).join('');
  const pbs=(f.prios||[]).filter(Boolean).map((p,i)=>{const cols=['#CE1126','#7a4800','#002654'];const c=cols[i<3?i:i%3];return`<div style="display:flex;align-items:center;gap:12px;padding:8px 11px;border-radius:4px;border-left:4px solid ${c};background:#f8f9fc;margin-bottom:6px"><span style="font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:${c};min-width:18px;text-align:center">${i+1}</span><span style="font-size:12px;color:#2a2a2a">${esc(p)}</span></div>`;}).join('')||`<span style="font-size:11px;color:#ccc;font-style:italic">Aucune priorité</span>`;
  return`
<div style="background:#002654">

          ${f.cat?`<span style="font-size:12px;color:#7a95bb">⚖️ ${esc(f.cat)}</span>`:''}
          ${f.club?`<span style="font-size:12px;color:#7a95bb">🏢 ${esc(f.club)}</span>`:''}
          ${f.grade?`<span style="font-size:12px;color:#7a95bb">🎽 ${esc(f.grade)}</span>`:''}
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="${res.s};font-family:'Syne',sans-serif;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:5px 12px;border-radius:3px;display:inline-block;margin-bottom:6px">${res.l}</div>
        ${f.comp?`<div style="font-size:11px;color:#7a95bb">${esc(f.comp)}</div>`:''}
        ${f.date?`<div style="font-size:11px;color:#7a95bb">${esc(f.date)}</div>`:''}
      </div>
    </div>
  </div>
</div>
<div style="padding:14px 18px 24px">
  <div style="font-family:'Syne',sans-serif;font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#002654;padding:9px 0 7px;border-bottom:2px solid #002654;margin-bottom:12px">Combats</div>
  ${cbs||'<p style="font-size:12px;color:#ccc;font-style:italic">Aucun combat</p>'}
  <div style="font-family:'Syne',sans-serif;font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#002654;padding:9px 0 7px;border-bottom:2px solid #002654;margin-bottom:12px;margin-top:14px">Priorités de travail</div>

    <div style="padding:11px 15px">${pbs}</div>

renderList();
